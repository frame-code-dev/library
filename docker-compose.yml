services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - library_network
    depends_on:
      - db
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: library
      DB_USERNAME: library_user
      DB_PASSWORD: library_password

  webserver:
    image: nginx:alpine
    container_name: library_webserver
    restart: unless-stopped
    ports:
      - "8004:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - library_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: library_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: library
      MYSQL_USER: library_user
      MYSQL_PASSWORD: library_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - library_db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - library_network

networks:
  library_network:
    driver: bridge

volumes:
  library_db_data:
    driver: local
